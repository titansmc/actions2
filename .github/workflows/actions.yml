name: Monedes

on:
  push: 
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparem l'entorn amb els paquets
        run: pip install pyinstaller
          
      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py
