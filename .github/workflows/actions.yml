name: Comprovar desplegament

on:
  push: 
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparem l'entorn amb els paquets
        run: pip install pyinstaller
          
      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

      - uses: actions/upload-artifact@v4
        with:
          name: comprova-desplegaments-windows
          path: dist/comprova_desplegaments_win
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparem l'entorn amb els paquets
        run: pip install pyinstaller
          
      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

      - uses: actions/upload-artifact@v4
        with:
          name: comprova-desplegaments-macos
          path: dist/comprova_desplegaments_mac
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparem l'entorn amb els paquets
        run: pip install pyinstaller
          
      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

      - uses: actions/upload-artifact@v4
        with:
          name: comprova-desplegaments-linux
          path: dist/comprova_desplegaments_lin
